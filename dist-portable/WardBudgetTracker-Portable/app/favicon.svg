<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d8cd9"/>
      <stop offset="1" stop-color="#005c9e"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ledger book -->
  <g>
    <!-- back cover shadow -->
    <rect x="96" y="120" width="320" height="280" rx="16" fill="#003a66"/>
    <!-- front page -->
    <rect x="108" y="108" width="296" height="280" rx="14" fill="#ffffff"/>
    <!-- spine -->
    <rect x="248" y="108" width="14" height="280" fill="#e2e8f0"/>
    <!-- ledger lines (left page) -->
    <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
      <line x1="132" y1="160" x2="232" y2="160"/>
      <line x1="132" y1="200" x2="232" y2="200"/>
      <line x1="132" y1="240" x2="232" y2="240"/>
      <line x1="132" y1="280" x2="232" y2="280"/>
      <line x1="132" y1="320" x2="232" y2="320"/>
    </g>
    <!-- ledger lines (right page) -->
    <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
      <line x1="278" y1="160" x2="378" y2="160"/>
      <line x1="278" y1="200" x2="378" y2="200"/>
      <line x1="278" y1="240" x2="378" y2="240"/>
      <line x1="278" y1="280" x2="378" y2="280"/>
      <line x1="278" y1="320" x2="378" y2="320"/>
    </g>
  </g>

  <!-- Peso coin badge bottom-right -->
  <g>
    <circle cx="396" cy="396" r="76" fill="#ffffff" stroke="#003a66" stroke-width="6"/>
    <text x="396" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="#005c9e">&#8369;</text>
  </g>
</svg>
