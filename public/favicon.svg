<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d8cd9"/>
      <stop offset="1" stop-color="#005c9e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- chapel body -->
  <g fill="#ffffff">
    <!-- steeple -->
    <rect x="240" y="150" width="32" height="120"/>
    <polygon points="256,90 232,150 280,150"/>
    <!-- cross (simple) replaced with finial dot for neutrality -->
    <circle cx="256" cy="80" r="10"/>
    <!-- main building -->
    <rect x="120" y="270" width="272" height="150" rx="6"/>
    <!-- roof -->
    <polygon points="100,270 256,200 412,270"/>
    <!-- door -->
    <rect x="236" y="330" width="40" height="90" rx="6" fill="#005c9e"/>
    <!-- windows -->
    <rect x="155" y="305" width="40" height="55" rx="4" fill="#005c9e"/>
    <rect x="317" y="305" width="40" height="55" rx="4" fill="#005c9e"/>
  </g>
  <!-- peso glyph badge bottom-right -->
  <g>
    <circle cx="400" cy="400" r="64" fill="#ffffff"/>
    <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#005c9e">&#8369;</text>
  </g>
</svg>
